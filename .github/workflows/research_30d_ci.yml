name: Tier-1 Research 30D — Regression Tests
on:
  pull_request:
    paths:
      - 'research_30d*.py'
      - 'forecast_ledger.py'
      - 'evidence_windows.py'
      - 'component_research.py'
      - 'day_direction.py'
      - 'stop_levels.py'
      - 'decision_panel.py'
      - 'performance_ledger.py'
      - 'shadow_eval.py'
      - 'test_shadow.py'
      - 'gatekeeper.py'
      - 'stateful_adaptive_controller.py'
      - 'config.py'
      - 'test_market_structure.py'
      - 'test_decision_panel_simple.py'
      - 'tests/test_component_research.py'
      - 'test_forecast_ledger.py'
      - 'trade_plan.py'
      - 'state_sync.py'
      - 'stateful_background_tracker.py'
      - 'system_health.py'
      - 'tests/test_research30*.py'
      - '.github/workflows/research_30d*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Start bounded resource telemetry
        continue-on-error: true
        run: python3 scripts/resource_probe.py start
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Compile modules
        run: python -m py_compile trade_plan.py state_sync.py stateful_background_tracker.py research_30d.py research_30d_enrichment.py research_30d_okx.py research_30d_eval.py research_30d_monitor.py forecast_ledger.py
      - name: Offline regression tests
        run: |
          python -m unittest discover -s tests -p 'test_research30*.py' -v
          python -m pytest -q test_forecast_ledger.py tests/test_component_research.py test_decision_panel_simple.py test_market_structure.py test_clone_system.py test_shock_direction.py test_foundation_v32.py test_entry_xau_eth_v33.py test_walkforward_optimizer.py test_stateful_adaptive.py test_system_health.py test_state_sync.py test_shadow.py
      - name: Report runner capacity
        if: always()
        continue-on-error: true
        run: |
          probe="$RUNNER_TEMP/repo-resource-$GITHUB_RUN_ID-$GITHUB_JOB/probe.py"
          if test -f "$probe"; then python3 "$probe" finish; else echo "::warning::Resource telemetry unavailable"; fi
