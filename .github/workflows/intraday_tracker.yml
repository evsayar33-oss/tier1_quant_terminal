name: Tier-1 Quant Intraday Background Tracker

on:
  schedule:
    # Hafta içi 24 saat boyunca her 30 dakikada bir çalışır.
    # Yeni 1H bar oluşmadıysa history aynı timestamp'i ikinci satır olarak biriktirmez.
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

# Aynı workflow'un eşzamanlı iki kez çalışmasını engeller.
concurrency:
  group: tier1-quant-background-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Repo'dan Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Arka Plan Takip Motorunu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python background_tracker.py

      - name: State ve Geçmişi Repo'ya Kaydet
        run: |
          git config --local user.email "quantbot@github.com"
          git config --local user.name "QuantBot Tier-1"
          git add terminal_state.json terminal_history.csv ohlcv_history/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Background Quant State Güncelleme: $(date -u)" && git push)
