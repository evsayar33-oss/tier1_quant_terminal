name: Tier-1 Stateful Adaptive Quant Tracker v3.2

on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: tier1-quant-stateful-adaptive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stateful-track:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v6

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stateful Adaptive Cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python stateful_background_tracker.py

      - name: Commit state and memory
        run: |
          git config --local user.email "quantbot@github.com"
          git config --local user.name "QuantBot Tier-1"
          # Every file the system LEARNS into must be committed, otherwise the
          # next run starts from scratch and "self-improving" never happens.
          for f in terminal_state.json terminal_history_stateful.csv \
                   stateful_adaptive_memory.json ohlcv_history \
                   adaptive_regime_thresholds_state.json data_freshness_state.json \
                   timeframe_confluence_state.json performance_ledger.json \
                   performance_report.md state_backups; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "🤖 Stateful Adaptive Quant State: $(date -u)"
          # The weekly historical-validation job may have pushed in between:
          # rebase onto it instead of failing the push.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "Push başarısız" && exit 1
