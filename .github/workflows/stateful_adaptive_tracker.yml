name: Tier-1 Stateful Adaptive Quant Tracker v3.7

# v3.7: state lives on the `state` branch (ONE commit, force-pushed every run)
# instead of a new commit on `main` every 30 min. `main` = code only, so the
# repository no longer grows and Streamlit no longer reloads 16x a day.

on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: tier1-quant-stateful-adaptive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stateful-track:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Repository Checkout (code)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore published state + learned model
        run: |
          # First run: the branches do not exist yet -> the seed files in main are used.
          if git fetch --depth 1 origin state 2>/dev/null; then
            git archive FETCH_HEAD | tar -x
            echo "state dalı geri yüklendi"
          else
            echo "state dalı yok: main içindeki başlangıç dosyaları kullanılıyor"
          fi
          if git fetch --depth 1 origin reports 2>/dev/null; then
            git archive FETCH_HEAD validation_reports | tar -x || true
            echo "reports dalından öğrenilmiş model alındı"
          fi
          rm -f state_bundle.tar.gz

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stateful Adaptive Cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python stateful_background_tracker.py

      - name: Cap growing files + build bundle
        run: |
          python state_sync.py prune
          python state_sync.py bundle

      - name: Publish to the state branch (single commit, no history growth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUT="$RUNNER_TEMP/state_pub"
          rm -rf "$OUT" && mkdir -p "$OUT"
          for f in state_bundle.tar.gz terminal_state.json stateful_adaptive_memory.json \
                   adaptive_regime_thresholds_state.json data_freshness_state.json \
                   timeframe_confluence_state.json performance_ledger.json performance_report.md \
                   terminal_history_stateful.csv ohlcv_history state_backups; do
            if [ -e "$f" ]; then cp -r "$f" "$OUT/"; fi
          done
          cd "$OUT"
          git init -q
          git checkout -q -b state
          git config user.email "quantbot@github.com"
          git config user.name "QuantBot Tier-1"
          git add -A
          git commit -q -m "🤖 state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state && exit 0
            sleep 5
          done
          echo "state push başarısız" && exit 1
