name: Tier-1 Stateful Adaptive Quant Tracker v3.1

on:
  schedule:
    - cron: '*/30 * * * 1-5'
  workflow_dispatch:

concurrency:
  group: tier1-quant-stateful-adaptive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stateful-track:
    runs-on: ubuntu-latest
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v6

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stateful Adaptive Cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python stateful_background_tracker.py

      - name: Commit state and memory
        run: |
          git config --local user.email "quantbot@github.com"
          git config --local user.name "QuantBot Tier-1"
          git add terminal_state.json terminal_history_stateful.csv stateful_adaptive_memory.json ohlcv_history/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Stateful Adaptive Quant State: $(date -u)" && git push)
