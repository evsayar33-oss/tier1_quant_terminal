name: Tier-1 Motoru Şimdi Yeniden Başlat (manuel)

# v4.0: replaces the old "Stateful Adaptive Quant Tracker". The engine loop
# already runs that exact tracker cycle every hour, so a separate manual
# tracker only ever waited in the queue behind it (the reported problem).
# v3.8 Aşama 2: one long job runs the production cycle 90 s after EVERY
# hourly bar closes, for ~5h40m. The hourly schedule queues the next job
# (concurrency, no cancel), so when one ends the next starts -> continuous.
# Same concurrency group as the manual restart workflow -> a single writer of state.
# A queued ("Queued"/"Pending") run in the list is NORMAL: it is the next job
# waiting for the current one to finish.

on:
  workflow_dispatch:

# cancel-in-progress: TRUE -> this run does NOT wait in the queue: it stops the
# running engine job (its last hourly cycle is already published) and starts
# a fresh engine immediately with the newest code. The hourly schedule of
# "Tier-1 Engine Loop" then continues behind it as usual.
concurrency:
  group: tier1-quant-stateful-adaptive
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  restart-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Repository Checkout (code)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore published state + learned model
        run: |
          if git fetch --depth 1 origin state 2>/dev/null; then git archive FETCH_HEAD | tar -x; echo "state geri yüklendi"; fi
          if git fetch --depth 1 origin reports 2>/dev/null; then git archive FETCH_HEAD validation_reports | tar -x || true; fi
          # v4.0: newest weekly Strategy Lab results (overrides the copy inside the state bundle)
          if git fetch --depth 1 origin lab 2>/dev/null; then git archive FETCH_HEAD | tar -x; echo "lab sonuçları alındı"; fi
          rm -f state_bundle.tar.gz

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Engine loop
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot_loop.py --max-minutes 340
