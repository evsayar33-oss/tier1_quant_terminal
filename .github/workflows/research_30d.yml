name: Tier-1 30 Gün Kanıt Araştırması — Başlat / Kontrol
on:
  workflow_dispatch:
    inputs:
      action:
        description: "start = mevcut deneyi koruyarak başlat; check = sadece raporla"
        required: true
        default: start
        type: choice
        options:
          - start
          - check

# Same lock as the production publisher. The existing hourly engine remains
# responsible for subsequent observations and state publication.
concurrency:
  group: tier1-quant-stateful-adaptive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Restore all live state without deleting existing ledgers
        run: |
          if git fetch --depth 1 origin state 2>/dev/null; then
            git archive FETCH_HEAD | tar -x
          else
            echo "State branch unavailable; refusing to start experiment"
            exit 1
          fi
          if git fetch --depth 1 origin reports 2>/dev/null; then
            git archive FETCH_HEAD validation_reports | tar -x || true
          fi
          rm -f state_bundle.tar.gz
      - name: Validate research package
        run: python -m unittest discover -s tests -p 'test_research30*.py' -v
      - name: Initialize or inspect existing experiment
        if: ${{ inputs.action == 'start' }}
        run: python research_30d.py start
      - name: Inspect 30-day experiment
        if: ${{ inputs.action == 'check' }}
        run: python research_30d.py check
      - name: Publish with a normal production cycle (start only)
        if: ${{ inputs.action == 'start' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python engine_loop.py --once
      - name: Summarize
        if: always()
        run: |
          if [ -f research_30d/report.md ]; then
            cat research_30d/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "30-day research report not found." >> "$GITHUB_STEP_SUMMARY"
          fi
