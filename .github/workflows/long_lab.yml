name: Tier-1 Long Lab (10 yıl, mühürlü son 2 yıl)

# v8.0: the REAL production pipeline replayed once a day over ~10 years
# (long_replay.py, daily clock, point-in-time) + CFTC COT since ~2014, then
# long_lab.py: a narrow rule universe, selection ONLY on the training years,
# yearly walk-forward, and a single exam on the sealed last 2 years.
#
# RESULTS: run page -> Summary (full report + zip link) and Artifacts ->
# long-lab-results; also the `longlab` branch (zip link in the summary).
# "replay: no" re-runs only the lab on the last published system history.

on:
  workflow_dispatch:
    inputs:
      replay:
        description: "Sistemi 10 yıl yeniden oynat (yes) / son kaydı kullan (no)"
        required: false
        default: "yes"
      years:
        description: "Kaç yıl geriye"
        required: false
        default: "10"

concurrency:
  group: tier1-long-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  replay:
    if: ${{ github.event.inputs.replay != 'no' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: System replay on a daily clock (~10 years, point-in-time)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python long_replay.py --years "${{ github.event.inputs.years || '10' }}" --out long_reports --max-minutes 290
      - name: CFTC COT positioning history
        continue-on-error: true
        timeout-minutes: 20
        run: python alt_data.py --days 0 --years 13 --out long_reports/cot_long.csv.gz || echo "COT alınamadı"
      - uses: actions/upload-artifact@v6
        with:
          name: long-replay
          path: long_reports/
          retention-days: 30

  lab:
    needs: replay
    if: ${{ always() && (needs.replay.result == 'success' || needs.replay.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Inputs from this run
        if: ${{ needs.replay.result == 'success' }}
        uses: actions/download-artifact@v6
        with:
          name: long-replay
          path: long_reports
      - name: Inputs from the last published run (replay = no)
        if: ${{ needs.replay.result == 'skipped' }}
        run: |
          mkdir -p long_reports
          if git fetch --depth 1 origin longlab 2>/dev/null; then git archive FETCH_HEAD inputs | tar -x && cp -r inputs/. long_reports/; fi
          ls -la long_reports
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Long research (sealed 2-year exam)
        run: |
          python long_lab.py --panel long_reports/signal_panel_daily.csv.gz --prices long_reports/prices_daily.csv.gz \
                             --alt long_reports/cot_long.csv.gz --out long_out
          mkdir -p long_out/inputs
          cp long_reports/* long_out/inputs/ 2>/dev/null || true
      - name: Report on the run page
        if: always()
        run: |
          {
            echo "## ⬇️ Sonuç dosyaları"
            echo ""
            echo "- **Tek tıkla hepsi (zip):** https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/longlab.zip"
            echo "- Bu sayfanın en altında **Artifacts → long-lab-results**"
            echo ""
            if [ -f long_reports/long_replay_meta.json ]; then echo '```'; cat long_reports/long_replay_meta.json; echo '```'; fi
            if [ -f long_out/long_lab_report.md ]; then cat long_out/long_lab_report.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: long-lab-results
          path: long_out/
          retention-days: 30
      - name: Publish to the longlab branch (single commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd long_out
          git init -q
          git checkout -q -b longlab
          git config user.email "quantbot@github.com"
          git config user.name "QuantBot Tier-1"
          git add -A
          git commit -q -m "🧭 long lab $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" longlab && exit 0
            sleep 5
          done
          exit 1
