name: Tier-1 Historical Walk-Forward Validation

# Runs the REAL production pipeline over past data, point-in-time
# (see historical_replay.py) and commits the report to
# validation_reports/historical_replay_report.md.
#
# Start it from the phone: GitHub app -> repo -> Actions ->
# "Tier-1 Historical Walk-Forward Validation" -> Run workflow.
# It also refreshes itself every Saturday.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kaç günlük geçmiş test edilsin (en fazla ~700)"
        required: false
        default: "365"
      step_hours:
        description: "Kaç saatte bir karar üretilsin (küçük = daha çok örnek, daha uzun süre)"
        required: false
        default: "4"
  schedule:
    - cron: '17 6 * * 6'

concurrency:
  group: tier1-historical-validation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Repository Checkout
        uses: actions/checkout@v6

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Walk-forward replay
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python historical_replay.py \
            --days "${{ github.event.inputs.days || '365' }}" \
            --step-hours "${{ github.event.inputs.step_hours || '4' }}" \
            --out validation_reports

      - name: Commit report
        run: |
          git config --local user.email "quantbot@github.com"
          git config --local user.name "QuantBot Tier-1"
          git add validation_reports
          if git diff --staged --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "🧪 Historical walk-forward validation: $(date -u)"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "Push başarısız" && exit 1
