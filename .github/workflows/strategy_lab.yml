name: Tier-1 Strategy Lab (strateji testi)

# v4.0 Aşama 4: broad, selection-corrected strategy research on 730 days of
# hourly bars (1h/4h) and ~10 years of daily bars, for SPX/NQ/XAU/XAG/BTC/ETH.
# ~4,000 configurations, walk-forward + Deflated Sharpe. Takes ~5-10 minutes.
# Results -> branch `lab` (one commit, no growth). The continuous engine picks
# them up at its next job start (or immediately via "Motoru Şimdi Yeniden Başlat").
# Runs every Saturday; start it any time from Actions -> Run workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 6'

concurrency:
  group: tier1-strategy-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Repository Checkout (code)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Strategy research
        run: python strategy_lab.py --source yahoo --out lab_out

      - name: Publish to the lab branch (single commit, no history growth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd lab_out
          git init -q
          git checkout -q -b lab
          git config user.email "quantbot@github.com"
          git config user.name "QuantBot Tier-1"
          git add -A
          git commit -q -m "🧪 strategy lab $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lab && exit 0
            sleep 5
          done
          echo "lab push başarısız" && exit 1

      - name: Show the FULL report in the run page
        if: always()
        run: |
          if [ -f lab_out/lab_report.md ]; then cat lab_out/lab_report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Downloadable result files (run page -> Artifacts -> strategy-lab-results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-results
          path: |
            lab_out/lab_report.md
            lab_out/lab_results.json
            lab_out/lab_playbook.json
          retention-days: 30
