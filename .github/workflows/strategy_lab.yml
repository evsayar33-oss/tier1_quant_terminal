name: Tier-1 Strategy Lab (strateji testi)

# v5.0: leveraged perpetual-futures research over EVERY system signal (alone and
# in combinations) + 54 technical rules, long/short/long-only/short-only,
# 8 exit rules, funding & fees, leverage/liquidation table. Walk-forward +
# Deflated Sharpe + alpha vs holding. v6: 5 holding horizons + combination
# discovery with an untouched holdout. v7: system direction used ONLY as a
# filter for technical entry triggers (RSI2, Bollinger, Donchian, EMA20, MACD,
# Keltner) + a NEW information source: Binance futures positioning (open
# interest, long/short ratios, taker flow, perp premium) and CFTC Commitments
# of Traders for all 6 assets (free, no key). Takes ~45-150 minutes.
#
# Uses the system's point-in-time signals from the `reports` branch
# (validation_reports/signal_panel.csv.gz, produced by
# "Tier-1 Historical Walk-Forward Validation"; falls back to factor_panel).
#
# RESULTS:
#   * run page -> bottom -> Artifacts -> strategy-lab-results (zip, all files)
#   * run page -> Summary: full report + a one-tap zip link of the `lab` branch
#   * the app's "Strateji Laboratuvarı" section (after the engine's next cycle)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 6'

concurrency:
  group: tier1-strategy-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Repository Checkout (code)
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Restore the system's historical signals (reports branch)
        run: |
          if git fetch --depth 1 origin reports 2>/dev/null; then
            git archive FETCH_HEAD validation_reports | tar -x || true
          fi
          ls -la validation_reports || echo "reports dalı yok: sadece teknik kurallar test edilecek"

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: New information source (Binance positioning + CFTC COT, point-in-time)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          mkdir -p validation_reports
          python alt_data.py --out validation_reports/alt_panel.csv.gz --days 760 --years 4 || echo "alternatif veri indirilemedi; onsuz devam"

      - name: Strategy research
        run: |
          python strategy_lab.py --source yahoo --out lab_out
          if [ -f validation_reports/alt_panel.csv.gz ]; then cp validation_reports/alt_panel.csv.gz lab_out/alt_panel.csv.gz; fi

      - name: Download links + full report on the run page
        if: always()
        run: |
          {
            echo "## ⬇️ Sonuç dosyaları"
            echo ""
            echo "- **Tek tıkla hepsi (zip):** https://github.com/${GITHUB_REPOSITORY}/archive/refs/heads/lab.zip"
            echo "- Bu sayfanın en altında **Artifacts → strategy-lab-results** (aynı dosyalar)"
            echo ""
            if [ -f lab_out/lab_report.md ]; then cat lab_out/lab_report.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result files (Artifacts -> strategy-lab-results)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: strategy-lab-results
          path: |
            lab_out/lab_report.md
            lab_out/lab_results.json
            lab_out/lab_playbook.json
            lab_out/lab_all_configs.csv.gz
            lab_out/alt_panel.csv.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Publish to the lab branch (single commit, no history growth)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd lab_out
          git init -q
          git checkout -q -b lab
          git config user.email "quantbot@github.com"
          git config user.name "QuantBot Tier-1"
          git add -A
          git commit -q -m "🧪 strategy lab $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" lab && exit 0
            sleep 5
          done
          echo "lab push başarısız" && exit 1
